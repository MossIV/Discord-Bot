name: Build and push Docker image

on:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  build_and_push:
    runs-on: ubuntu-latest
    needs: lint-test          # ← don't push if lint/test fails
    steps:
      - uses: actions/checkout@v4    # ← was missing from your amd64 job

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU           # ← needed for cross-compilation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64   # ← single manifest, both arches
          tags: ${{ vars.DOCKER_USERNAME }}/${{ vars.REPO_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max